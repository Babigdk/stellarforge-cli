[workspace]
resolver = "2"
members = ["contracts/*"]

[workspace.package]
edition = "2021"
rust-version = "1.84.0"

[workspace.dependencies]
soroban-sdk = "26"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
