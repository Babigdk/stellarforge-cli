# SW-178: E2E smoke workflow. Policy: read-only contents permission, no
# artifact uploads (smoke logs are ephemeral), and no release publishing from
# PRs. Any artifact upload added here must set explicit retention-days and
# exclude .env files, credentials, and local caches.
# See tests/workflow-security.test.ts for the enforcing assertions.
name: E2E Smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  # Explicitly deny everything else; artifact uploads (if ever added) must
  # not require broader scopes than this.
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: e2e-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Linked CLI MVP smoke / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        # Mirrors the package's supported Node major-version matrix (see
        # engines.node in package.json) so a dependency update that only
        # breaks the CLI on one supported runtime still fails this gate.
        node: ['22.13.0', '24']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install from committed lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build production CLI
        run: npm run build

      - name: Link built CLI
        run: npm link --ignore-scripts

      - name: Verify linked executable
        run: |
          stellarforge --help
          stellarforge --version

      - name: Run deterministic MVP smoke path
        run: npm run test:e2e

      # No artifact upload step is defined for this workflow. Smoke output is
      # intentionally ephemeral: uploading it would risk leaking local .env
      # files, credentials, or caches, and PR runs must never publish release
      # artifacts. If an upload is added later it MUST set retention-days and
      # an explicit path allowlist (see tests/workflow-security.test.ts).
