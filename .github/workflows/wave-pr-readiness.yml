name: Wave PR Readiness

on:
  workflow_run:
    workflows:
      - CI
      - CodeQL
      - Dependency Review
      - E2E Smoke
      - Contributor PR Guard
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: wave-pr-readiness-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  readiness:
    name: Mark green Wave PRs ready for review
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile review readiness
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const labelName = 'review: ready';
            const requiredWorkflows = new Set([
              'CI',
              'CodeQL',
              'Dependency Review',
              'E2E Smoke',
              'Contributor PR Guard',
            ]);

            try {
              await github.rest.issues.getLabel({ owner, repo, name: labelName });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: labelName,
                color: '0e8a16',
                description: 'Current PR head passed the required automated Wave checks',
              });
            }

            const pullRefs = context.payload.workflow_run.pull_requests || [];
            for (const pullRef of pullRefs) {
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: pullRef.number,
              });
              const prLabels = new Set(pr.labels.map((label) => label.name));

              const removeReadyLabel = async () => {
                if (!prLabels.has(labelName)) return;
                try {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: pr.number, name: labelName,
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              };

              if (pr.state !== 'open' || pr.draft) {
                await removeReadyLabel();
                continue;
              }

              const ref = (pr.body || '').match(
                /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i,
              );
              if (!ref) {
                await removeReadyLabel();
                continue;
              }

              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({
                  owner, repo, issue_number: Number(ref[1]),
                }));
              } catch {
                await removeReadyLabel();
                continue;
              }
              if (!issue.labels.some((label) => label.name === 'Stellar Wave')) {
                await removeReadyLabel();
                continue;
              }
              if (!issue.assignees.some((assignee) => assignee.login === pr.user.login)) {
                await removeReadyLabel();
                continue;
              }

              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                {
                  owner,
                  repo,
                  head_sha: pr.head.sha,
                  event: 'pull_request',
                  per_page: 100,
                },
              );
              const latestByWorkflow = new Map();
              for (const run of runs) {
                if (!requiredWorkflows.has(run.name)) continue;
                const current = latestByWorkflow.get(run.name);
                if (!current || new Date(run.created_at) > new Date(current.created_at)) {
                  latestByWorkflow.set(run.name, run);
                }
              }

              const green = [...requiredWorkflows].every((name) => {
                const run = latestByWorkflow.get(name);
                return run?.status === 'completed' && run?.conclusion === 'success';
              });

              if (!green) {
                await removeReadyLabel();
                continue;
              }

              if (!prLabels.has(labelName)) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: pr.number, labels: [labelName],
                });
              }
              core.info('Wave PR #' + pr.number + ' is ready for maintainer review.');
            }
