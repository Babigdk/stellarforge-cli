name: Wave Application Guidance

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  guidance:
    name: Direct claim commands to Drips
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain the official assignment process
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.issue.number;
            const actor = context.actor;
            const command = (context.payload.comment.body || '').trim().toLowerCase();
            if (!['/claim', '/unclaim'].includes(command)) return;

            const { data: issue } = await github.rest.issues.get({
              owner, repo, issue_number: issueNumber,
            });
            const labels = new Set(issue.labels.map((label) => label.name));

            if (!labels.has('Stellar Wave')) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: '@' + actor + ', this issue is not currently active in the Drips Stellar Wave program. Please wait for a maintainer to activate the issue before applying.',
              });
              return;
            }

            if (command === '/claim') {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: '@' + actor + ', Stellar Wave issues are assigned through the Drips application process, not by GitHub self-claim. Please apply for this issue in Drips and wait for maintainer acceptance and GitHub assignment before starting substantial work.',
              });
              return;
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number: issueNumber,
              body: '@' + actor + ', release or withdraw your assignment through Drips and notify the maintainer. This command does not automatically change the official Drips or GitHub assignment.',
            });
