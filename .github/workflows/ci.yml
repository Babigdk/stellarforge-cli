name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          package-manager-cache: false

      - name: Install from committed lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate GitHub Actions workflows with actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Audit workflow least-privilege permissions
        run: npm run audit:workflow-permissions

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: E2E smoke
        run: npm run test:e2e

  platform:
    name: Platform / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / Node 22
            os: ubuntu-latest
            node: '22.13.0'
          - name: Linux / Node 24
            os: ubuntu-latest
            node: '24'
          - name: macOS / Node 22
            os: macos-latest
            node: '22.13.0'
          - name: Windows / Node 22
            os: windows-latest
            node: '22.13.0'

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install from committed lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run platform test suite
        run: npm test

      - name: Build platform artifact
        run: npm run build

      - name: Smoke / basic-app / generate
        run: node dist/cli.js new smoke-basic-app --template basic-app

      - name: Smoke / basic-app / install
        working-directory: ./smoke-basic-app
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Smoke / basic-app / check
        working-directory: ./smoke-basic-app
        run: npm run check

      - name: Smoke / basic-app / test
        working-directory: ./smoke-basic-app
        run: npm test

      - name: Smoke / api-service / generate
        run: node dist/cli.js new smoke-api-service --template api-service

      - name: Smoke / api-service / install
        working-directory: ./smoke-api-service
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Smoke / api-service / check
        working-directory: ./smoke-api-service
        run: npm run check

      - name: Smoke / api-service / test
        working-directory: ./smoke-api-service
        run: npm test

      - name: Smoke / full-stack / generate
        run: node dist/cli.js new smoke-full-stack --template full-stack

      - name: Smoke / full-stack / install
        working-directory: ./smoke-full-stack
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Smoke / full-stack / check
        working-directory: ./smoke-full-stack
        run: npm run check

      - name: Smoke / full-stack / test
        working-directory: ./smoke-full-stack
        run: npm test

  cargo-smoke:
    name: Smart Contract / Cargo metadata & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          package-manager-cache: false

      - name: Install from committed lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build CLI
        run: npm run build

      - name: Smoke / smart-contract / generate
        run: node dist/cli.js new smoke-smart-contract --template smart-contract

      - name: Smoke / smart-contract / cargo metadata
        working-directory: ./smoke-smart-contract
        run: cargo metadata --no-deps --format-version 1

      - name: Smoke / smart-contract / cargo test
        working-directory: ./smoke-smart-contract
        run: cargo test
