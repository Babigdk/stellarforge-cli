
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.13.0'
  CI: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate GitHub Actions workflows
        uses: rhysd/actionlint@v1.7.7

      - name: Audit workflow permissions
        run: npm run audit:workflow-permissions

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: E2E smoke tests
        run: npm run test:e2e

  platform:
    name: Platform / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / Node 22
            os: ubuntu-latest
            node: '22.13.0'

          - name: Linux / Node 24
            os: ubuntu-latest
            node: '24'

          - name: macOS / Node 22
            os: macos-latest
            node: '22.13.0'

          - name: Windows / Node 22
            os: windows-latest
            node: '22.13.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test generated templates
        shell: bash
        run: |
          set -euo pipefail

          templates=(
            basic-app
            api-service
            full-stack
          )

          for template in "${templates[@]}"; do
            project="smoke-${template}"

            echo "Generating ${template}..."

            node dist/cli.js new "$project" --template "$template"

            echo "Installing ${template}..."

            npm --prefix "$project" install \
              --ignore-scripts \
              --no-audit \
              --no-fund

            echo "Checking ${template}..."

            npm --prefix "$project" run check

            echo "Testing ${template}..."

            npm --prefix "$project" test
          done

  cargo-smoke:
    name: Smart Contract / Cargo metadata & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build CLI
        run: npm run build

      - name: Generate smart contract project
        run: node dist/cli.js new smoke-smart-contract --template smart-contract

      - name: Validate Cargo metadata
        working-directory: ./smoke-smart-contract
        run: cargo metadata --no-deps --format-version 1

      - name: Run Cargo tests
        working-directory: ./smoke-smart-contract
        run: cargo test
